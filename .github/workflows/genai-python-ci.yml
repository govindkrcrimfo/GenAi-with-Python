
name: GenAI Python CI Pipeline

on:
  push:
    branches:
      - '**'

  pull_request:
    branches:
      - main

jobs:
  python-build:
    name: Install and Validate Python Projects
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      # 3. Install uv
      - name: Install uv
        uses: astral-sh/setup-uv@v6

      # 4. Find and install dependencies of every uv project
      - name: Install all project dependencies
        shell: bash
        run: |
          found=0

          while IFS= read -r -d '' file; do
            found=1
            project_dir="$(dirname "$file")"

            echo "Installing dependencies in: $project_dir"

            (
              cd "$project_dir"

              if [ -f uv.lock ]; then
                uv sync --locked --no-install-project
              else
                uv sync --no-install-project
              fi
            )

          done < <(
            find . -type f -name "pyproject.toml" \
              -not -path "*/.venv/*" \
              -not -path "*/.git/*"
          )

          if [ "$found" -eq 0 ]; then
            echo "No Python projects with pyproject.toml found!"
            exit 1
          fi

      # 5. Validate every Python file recursively
      - name: Validate all Python files
        shell: bash
        run: |
          find . -type f -name "*.py" \
            -not -path "*/.venv/*" \
            -not -path "*/.git/*" \
            -not -path "*/__pycache__/*" \
            -print0 | xargs -0 -r python -m py_compile

      # 6. Pipeline success
      - name: Build completed
        run: echo "All Python projects passed dependency installation and syntax validation!"
